name: Kakao Notify
description: Send a KakaoTalk message through NotiBot
author: froggy1014
branding:
  icon: message-circle
  color: yellow
inputs:
  api-key:
    description: NotiBot service API key (kb_...). Needs messages:send, plus rooms:read when check-session is true.
    required: true
  room:
    description: Exact room display name; omit when room-id is set
    required: false
  room-id:
    description: Stable hub room UUID; use instead of room to survive Kakao display-name changes
    required: false
  text:
    description: Message text (truncated to 4000 chars)
    required: true
  request-id:
    description: Idempotency key. Reuse the same id for the same logical send; omit to let the SDK generate one.
    required: false
  base-url:
    description: Hub origin
    required: false
    default: https://api.notibot.xyz
  timeout-ms:
    description: Request timeout in milliseconds
    required: false
    default: "10000"
  check-session:
    description: Fail without sending when the room has no phone session (canReply=false) or is not bound
    required: false
    default: "true"
  fail-on-error:
    description: Mark the step failed on any error; set false to only warn
    required: false
    default: "true"
outputs:
  request-id:
    description: Request id, including uncertain failures when available
  queued:
    description: "true when the hub queued the message"
  duplicate:
    description: "true when the hub had already accepted this request id"
runs:
  using: node24
  main: dist/index.js
