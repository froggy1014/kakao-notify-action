name: NotiBot Notify
description: Send a KakaoTalk message through NotiBot
author: froggy1014
branding:
  icon: message-circle
  color: yellow
inputs:
  api-key:
    description: NotiBot service API key (kb_...). Needs messages:send, plus rooms:read when check-session is true.
    required: true
  room:
    description: Exact room display name. Set exactly one of room, room-slug or room-id
    required: false
  room-slug:
    description: Workspace-unique room slug (e.g. deploy-alerts). Set exactly one of room, room-slug or room-id
    required: false
  room-id:
    description: Stable hub room UUID; survives display-name and slug changes. Set exactly one of room, room-slug or room-id
    required: false
  text:
    description: Message text (truncated to 4000 chars)
    required: true
  mentions:
    description: Display names to tag (comma or newline separated). Each must match exactly one room member; Iris transport only
    required: false
  request-id:
    description: Idempotency key. Reuse the same id for the same logical send; omit to let the SDK generate one.
    required: false
  base-url:
    description: Hub origin
    required: false
    default: https://api.notibot.xyz
  timeout-ms:
    description: Request timeout in milliseconds
    required: false
    default: "10000"
  check-session:
    description: Fail without sending when the room has no phone session (canReply=false) or is not bound
    required: false
    default: "true"
  fail-on-error:
    description: Mark the step failed on any error; set false to only warn
    required: false
    default: "true"
outputs:
  request-id:
    description: Request id, including uncertain failures when available
  queued:
    description: "true when the hub queued the message"
  duplicate:
    description: "true when the hub had already accepted this request id"
runs:
  using: node24
  main: dist/index.js
